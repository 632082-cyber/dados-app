name: Build Flutter APK
on:
  push:
      branches:
            - main
              workflow_dispatch:
              jobs:
                build:
                    runs-on: ubuntu-latest
                        steps:
                              - uses: actions/checkout@v3
                                    - name: Setup Flutter
                                            uses: subosito/flutter-action@v2
                                                    with:
                                                              flutter-version: '3.24.0'
                                                                        channel: 'stable'
                                                                              - name: Get dependencies
                                                                                      working-directory: ./dados_app
                                                                                              run: flutter pub get
                                                                                                    - name: Build APK
                                                                                                            working-directory: ./dados_app
                                                                                                                    run: flutter build apk --release
                                                                                                                          - name: Upload APK
                                                                                                                                  uses: actions/upload-artifact@v3
                                                                                                                                          with:
                                                                                                                                                    name: app-release
                                                                                                                                                              path: dados_app/build/app/outputs/flutter-apk/app-release.apk
